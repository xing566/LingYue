<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>聆乐 · iOS 音乐 App 交互原型</title>
<style>
  :root{
    --bg:#05060c; --surface:#0d1019; --surface2:#141824;
    --stroke:#232a3a; --text:#f2f4f8; --sub:#8a91a5; --accent:#5b8cff;
    --accent2:#8f6bff; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1a1f33 0%, #05060c 60%);
    color:var(--text);
    font-family:-apple-system,"SF Pro Display","PingFang SC",system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{display:flex; gap:32px; align-items:center}
  .hint{max-width:260px; color:var(--sub); font-size:13px; line-height:1.7}
  .hint b{color:var(--text)}
  .hint ol{padding-left:18px; margin-top:8px}
  .phone{
    width:390px; height:844px; background:var(--bg);
    border-radius:46px; border:1px solid #2a3346; position:relative; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.03);
  }
  .status{display:flex; justify-content:space-between; padding:16px 28px 6px; font-size:13px; font-weight:600}
  .screen{position:absolute; inset:34px 0 84px; display:flex; flex-direction:column}

  /* ---------- 顶部导航 ---------- */
  .topnav{display:flex; align-items:center; justify-content:space-between; padding:10px 18px}
  .topnav h1{font-size:26px; font-weight:800; letter-spacing:.5px}
  .iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--sub);
    background:var(--surface2); font-size:17px; cursor:pointer; border:none}
  .seg{display:flex; background:var(--surface2); border-radius:10px; padding:3px; margin:6px 18px 10px}
  .seg button{flex:1;border:none;background:transparent;color:var(--sub);font-size:13px;font-weight:600;
    padding:7px 0;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.4)}

  /* ---------- 内容 ---------- */
  .content{flex:1; overflow-y:auto; padding:2px 18px 20px; scrollbar-width:none}
  .content::-webkit-scrollbar{display:none}
  .playall{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:15px;font-weight:700;
    padding:10px 6px;cursor:pointer; border-radius:10px}
  .playall:active{background:var(--surface2)}
  .row{display:flex; align-items:center; gap:12px; padding:9px 6px; border-radius:12px; cursor:pointer}
  .row:active{background:var(--surface2)}
  .row.playing .t{color:var(--accent)}
  .art{width:44px;height:44px;border-radius:8px; flex:none; overflow:hidden; background:var(--surface2);
    display:grid;place-items:center; color:#667; font-size:18px; position:relative}
  .art img{width:100%;height:100%;object-fit:cover}
  .row .meta{flex:1; min-width:0}
  .row .t{font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .s{font-size:12.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .dur{font-size:11.5px; color:var(--sub); font-variant-numeric:tabular-nums}

  /* 网格（专辑） */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; padding-top:6px}
  .album .art{width:100%; height:168px; border-radius:14px; margin-bottom:8px; font-size:30px}
  .album .t{font-size:14px; font-weight:600; white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .album .s{font-size:12px; color:var(--sub)}

  .empty{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--sub);padding:70px 30px;text-align:center}
  .empty .big{font-size:46px;color:#3a4360}
  .empty b{color:var(--text); font-size:17px}

  /* 搜索 */
  .searchbar{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;
    padding:9px 12px;margin:8px 18px 6px}
  .searchbar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:15px}
  .searchbar input::placeholder{color:var(--sub)}

  /* ---------- 迷你播放条 ---------- */
  .mini{position:absolute; left:10px; right:10px; bottom:96px; background:rgba(20,24,36,.9);
    backdrop-filter:blur(14px); border:1px solid var(--stroke); border-radius:16px;
    display:flex;align-items:center;gap:12px; padding:9px 12px; cursor:pointer; display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .mini.show{display:flex}
  .mini .art{width:42px;height:42px}
  .mini .meta{flex:1; min-width:0}
  .mini .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .s{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .ctrl{font-size:30px;color:var(--text)}

  /* ---------- TabBar ---------- */
  .tabbar{position:absolute; left:0;right:0;bottom:0;height:84px; display:flex;
    background:rgba(8,10,16,.92); backdrop-filter:blur(20px); border-top:1px solid var(--stroke)}
  .tab{flex:1; display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--sub); font-size:10.5px; cursor:pointer; border:none;background:none}
  .tab .ic{font-size:21px}
  .tab.on{color:var(--accent)}

  /* ---------- 播放页 ---------- */
  .player{position:absolute; inset:0; z-index:30; background:linear-gradient(180deg,#1a1f33 0%,#0a0c14 100%);
    display:flex;flex-direction:column; transform:translateY(102%); transition:transform .38s cubic-bezier(.2,.8,.2,1)}
  .player.open{transform:translateY(0)}
  .player .head{display:flex;align-items:center;padding:16px 22px 6px}
  .player .head .grab{width:38px;height:5px;border-radius:3px;background:#3a4360;margin:0 auto 0}
  .player .head .back{margin-left:auto;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--sub)}
  .p-art{width:300px;height:300px;border-radius:22px;margin:26px auto 30px;overflow:hidden;background:var(--surface2);
    display:grid;place-items:center;font-size:90px;color:#334; box-shadow:0 30px 60px rgba(0,0,0,.55)}
  .p-art img{width:100%;height:100%;object-fit:cover}
  .p-title{font-size:22px;font-weight:800;text-align:center;padding:0 30px}
  .p-artist{font-size:15px;color:var(--sub);text-align:center;padding:6px 30px 20px}
  .p-prog{padding:0 26px}
  .track{height:5px;background:#2b3346;border-radius:3px;position:relative;cursor:pointer}
  .track .fill{position:absolute;left:0;top:0;bottom:0;width:20%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px}
  .p-times{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding:7px 2px 0}
  .p-ctrl{display:flex;align-items:center;justify-content:center;gap:44px;padding:22px 0 14px}
  .p-ctrl button{border:none;background:none;color:var(--text);cursor:pointer}
  .p-ctrl .side{font-size:22px}
  .p-ctrl .side.off{opacity:.5}
  .p-ctrl .main{font-size:66px}
  .p-vol{display:flex;align-items:center;gap:10px;padding:0 26px;color:var(--sub)}
  .p-vol .vol-track{flex:1;height:5px;background:#2b3346;border-radius:3px;position:relative}
  .p-vol .vol-fill{position:absolute;left:0;top:0;bottom:0;width:70%;background:#fff;border-radius:3px}

  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hint">
    <b>聆乐 · iOS 音乐 App 交互原型</b>
    <ol>
      <li>点击歌曲开始“播放”，底部出现迷你播放条</li>
      <li>点击迷你播放条打开全屏播放页</li>
      <li>切换 歌曲/专辑/歌手、播放列表、搜索、设置 标签</li>
      <li>播放页可切 播放/暂停、上一首/下一首、随机、循环</li>
    </ol>
    <p style="margin-top:14px;color:#7b83a0">原型为静态演示；正式版为 SwiftUI 原生实现（见工程源码）。</p>
  </div>

  <div class="phone">
    <div class="status"><span>9:41</span><span>●●● ▮▮▮</span></div>

    <!-- 主屏 -->
    <div class="screen" id="mainScreen">
      <div class="topnav">
        <h1 id="navTitle">音乐库</h1>
        <button class="iconbtn" id="navRight" title="导入">＋</button>
      </div>
      <div class="seg" id="segWrap">
        <button data-seg="songs" class="on">歌曲</button>
        <button data-seg="albums">专辑</button>
        <button data-seg="artists">歌手</button>
      </div>
      <div class="content" id="content"></div>
    </div>

    <!-- 迷你播放条 -->
    <div class="mini" id="mini">
      <div class="art" id="mArt"><i class="fa"></i></div>
      <div class="meta"><div class="t" id="mTitle">—</div><div class="s" id="mSub">—</div></div>
      <div class="ctrl" id="mPlay">⏸</div>
    </div>

    <!-- 底部标签栏 -->
    <div class="tabbar" id="tabbar">
      <button class="tab on" data-tab="library"><span class="ic">♪</span>音乐库</button>
      <button class="tab" data-tab="playlists"><span class="ic">☰</span>播放列表</button>
      <button class="tab" data-tab="search"><span class="ic">🔍</span>搜索</button>
      <button class="tab" data-tab="settings"><span class="ic">⚙</span>设置</button>
    </div>

    <!-- 播放页 -->
    <div class="player" id="player">
      <div class="head">
        <div class="grab"></div>
        <div class="back" id="pBack">▼</div>
      </div>
      <div class="p-art" id="pArt"></div>
      <div class="p-title" id="pTitle">—</div>
      <div class="p-artist" id="pArtist">—</div>
      <div class="p-prog">
        <div class="track" id="track"><div class="fill" id="trackFill"></div></div>
        <div class="p-times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="p-ctrl">
        <button class="side" id="pShuffle">🔀</button>
        <button class="side" id="pPrev">⏮</button>
        <button class="main" id="pPlay">▶</button>
        <button class="side" id="pNext">⏭</button>
        <button class="side off" id="pRepeat">🔁</button>
      </div>
      <div class="p-vol"><span>🔉</span><div class="vol-track"><div class="vol-fill"></div></div><span>🔊</span></div>
    </div>
  </div>
</div>

<script>
/* ---------- 示例数据 ---------- */
const SONGS = [
  {id:1, t:"夜的第七章", s:"周杰伦", a:"我很忙", d:"4:18", len:258, g:["hsl(225,45%,42%)","hsl(255,55%,28%)"], ic:"♪"},
  {id:2, t:"Lemon", s:"米津玄師", a:"Lemon", d:"4:17", len:257, g:["hsl(35,60%,45%)","hsl(15,50%,30%)"], ic:"♪"},
  {id:3, t:"起风了", s:"买辣椒也用券", a:"起风了", d:"5:12", len:312, g:["hsl(160,40%,40%)","hsl(190,55%,24%)"], ic:"♪"},
  {id:4, t:"晴天", s:"周杰伦", a:"叶惠美", d:"4:29", len:269, g:["hsl(200,60%,40%)","hsl(230,60%,24%)"], ic:"♪"},
  {id:5, t:"孤勇者", s:"陈奕迅", a:"孤勇者", d:"4:16", len:256, g:["hsl(350,45%,42%)","hsl(330,60%,26%)"], ic:"♪"},
  {id:6, t:"平凡之路", s:"朴树", a:"猎户星座", d:"5:01", len:301, g:["hsl(100,35%,38%)","hsl(140,45%,22%)"], ic:"♪"},
  {id:7, t:"Viva La Vida", s:"Coldplay", a:"Viva La Vida", d:"4:01", len:241, g:["hsl(15,65%,50%)","hsl(0,60%,28%)"], ic:"♪"},
  {id:8, t:"稻香", s:"周杰伦", a:"魔杰座", d:"3:43", len:223, g:["hsl(90,55%,40%)","hsl(60,55%,26%)"], ic:"♪"},
  {id:9, t:"Almost Home", s:"M83", a:"Oblivion OST", d:"4:47", len:287, g:["hsl(250,50%,40%)","hsl(280,60%,22%)"], ic:"♪"}
];
const ALBUMS = [
  {a:"周杰伦", album:"叶惠美", ids:[4,8]},
  {a:"米津玄師", album:"Lemon", ids:[2]},
  {a:"Coldplay", album:"Viva La Vida", ids:[7]}
];

const state = {
  tab:"library", seg:"songs", query:"",
  current:null, playing:false, idx:0, queue:SONGS.map(s=>s.id),
  prog:0, timer:null, repeat:0, shuffle:false
};

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
function coverHTML(s){ return `<div class="art" style="background:linear-gradient(135deg,${s.g[0]},${s.g[1]})">${s.ic}</div>`; }
function byId(id){ return SONGS.find(x=>x.id===id); }
function fmt(sec){ const m=Math.floor(sec/60), ss=Math.floor(sec%60); return m+":"+String(ss).padStart(2,"0"); }

/* ---------- 各标签渲染 ---------- */
function render(){
  if(state.tab==="library") renderLibrary();
  else if(state.tab==="playlists") renderPlaylists();
  else if(state.tab==="search") renderSearch();
  else renderSettings();
  $("segWrap").style.display = state.tab==="library" ? "flex":"none";
  $("navRight").style.display = state.tab==="library" ? "grid":"none";
  $("navTitle").textContent = {library:"音乐库",playlists:"播放列表",search:"搜索",settings:"设置"}[state.tab];
}

function renderLibrary(){
  const c=$("content");
  if(state.seg==="songs"){
    c.innerHTML = `<div class="playall" onclick="playAll()">▶ 播放全部</div>` +
      SONGS.map(s=>rowHTML(s)).join("");
  } else if(state.seg==="albums"){
    c.innerHTML = `<div class="grid">` + ALBUMS.map(a=>`
      <div class="album">
        <div class="art" style="background:linear-gradient(135deg,${byId(a.ids[0]).g[0]},${byId(a.ids[0]).g[1]})">♪</div>
        <div class="t">${a.album}</div><div class="s">${a.a}</div>
      </div>`).join("") + `</div>`;
  } else {
    const artists = {};
    SONGS.forEach(s=>{ (artists[s.s]=artists[s.s]||[]).push(s); });
    c.innerHTML = Object.entries(artists).map(([name,list])=>`
      <div class="row" onclick="gotoArtist()">
        <div class="art" style="background:#232a3a">👤</div>
        <div class="meta"><div class="t">${name}</div><div class="s">${list.length} 首歌曲</div></div>
      </div>`).join("");
  }
}
function rowHTML(s){
  const playing = state.current===s.id ? "playing":"";
  const ic = state.current===s.id && state.playing ? "⏸":"";
  return `<div class="row ${playing}" onclick="playSong(${s.id})">
      ${coverHTML(s)}
      <div class="meta"><div class="t">${s.t}</div><div class="s">${s.s}</div></div>
      <div class="dur">${ic||s.d}</div>
    </div>`;
}

function renderPlaylists(){
  const c=$("content");
  c.innerHTML = `
    <div class="playall">＋ 新建播放列表</div>
    <div class="row"><div class="art" style="background:linear-gradient(135deg,#3a4b8c,#14172b)">☰</div>
      <div class="meta"><div class="t">我的最爱</div><div class="s">4 首歌曲</div></div></div>
    <div class="row"><div class="art" style="background:linear-gradient(135deg,#4b6a8c,#16222b)">☰</div>
      <div class="meta"><div class="t">深夜循环</div><div class="s">6 首歌曲</div></div></div>`;
}

function renderSearch(){
  const c=$("content");
  const q=state.query.trim().toLowerCase();
  const bar = `<div class="searchbar">🔍 <input id="sIn" placeholder="歌名 / 歌手 / 专辑" value="${state.query}"></div>`;
  if(!q){
    c.innerHTML = bar + `<div class="empty"><div class="big">🎤</div><b>搜索曲库</b><div>输入歌名、歌手或专辑名，快速找到想听的歌。</div></div>`;
  }else{
    const res=SONGS.filter(s=> (s.t+s.s+s.a).toLowerCase().includes(q));
    c.innerHTML = bar + (res.length? `<div class="playall" style="font-size:13px;color:var(--sub)">找到 ${res.length} 首</div>`+res.map(rowHTML).join("")
      : `<div class="empty"><div class="big">🔍</div><b>没有找到“${state.query}”</b></div>`);
  }
  const inp=$("sIn"); if(inp){ inp.focus();
    inp.oninput=e=>{ state.query=e.target.value; renderSearch(); };
  }
}

function renderSettings(){
  const c=$("content");
  c.innerHTML = `
    <div class="row"><div class="meta"><div class="t">重新扫描本地曲库</div></div><div class="dur">⟳</div></div>
    <div class="row"><div class="meta"><div class="t">版本</div></div><div class="dur">1.0.0</div></div>
    <div class="row"><div class="meta"><div class="t">音乐来源</div></div><div class="dur">本地曲库</div></div>
    <div class="row"><div class="meta"><div class="t">歌曲数量</div></div><div class="dur">${SONGS.length} 首</div></div>
    <div class="empty" style="padding:30px"><div style="font-size:13px;line-height:1.7;color:var(--sub)">
      聆乐以本地播放为主，架构上预留在线流媒体扩展点（MusicSource 协议）。<br>接入在线源无需改动播放器与界面。</div></div>`;
}

/* ---------- 播放逻辑 ---------- */
function playSong(id){
  state.current=id; state.playing=true; state.idx=state.queue.indexOf(id);
  const s=byId(id); state.len=s.len; state.prog=0;
  $("mini").classList.add("show");
  $("mArt").innerHTML="<i></i>"; $("mArt").style.background=`linear-gradient(135deg,${s.g[0]},${s.g[1]})`;
  $("mTitle").textContent=s.t; $("mSub").textContent=s.s+" · "+s.a;
  $("mPlay").textContent="⏸";
  startTick(); render();
}
function playAll(){ playSong(state.queue[0]); }
function togglePlay(){
  state.playing=!state.playing;
  $("mPlay").textContent=state.playing?"⏸":"▶";
  $("pPlay").textContent=state.playing?"⏸":"▶";
  if(state.playing) startTick(); else clearInterval(state.timer);
  render();
}
function next(){ const q=state.queue; state.idx=(state.idx+1)%q.length; playSong(q[state.idx]); }
function prev(){ const q=state.queue; state.idx=(state.idx-1+q.length)%q.length; playSong(q[state.idx]); }
function startTick(){
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    state.prog+=1;
    if(state.prog>=state.len){ if(state.repeat===1){ state.prog=0; } else { next(); return; } }
    const p=Math.min(100, state.prog/state.len*100);
    $("trackFill").style.width=p+"%";
    $("tCur").textContent=fmt(state.prog); $("tDur").textContent=fmt(state.len);
  },1000);
}

/* ---------- 播放页 ---------- */
function openPlayer(){
  $("player").classList.add("open");
  const s=byId(state.current);
  $("pArt").innerHTML="<i></i>"; $("pArt").style.background=`linear-gradient(135deg,${s.g[0]},${s.g[1]})`;
  $("pTitle").textContent=s.t; $("pArtist").textContent=s.s+" — "+s.a;
  $("pPlay").textContent=state.playing?"⏸":"▶";
  $("tCur").textContent=fmt(state.prog); $("tDur").textContent=fmt(state.len);
  $("pRepeat").classList.toggle("off", state.repeat===0);
}
$("mini").onclick=openPlayer;
$("pBack").onclick=()=>$("player").classList.remove("open");
$("pPlay").onclick=togglePlay;
$("pNext").onclick=next;
$("pPrev").onclick=prev;
$("pShuffle").onclick=function(){ state.shuffle=!state.shuffle; this.classList.toggle("off",!state.shuffle);
  if(state.shuffle) state.queue=[...state.queue].sort(()=>Math.random()-.5); };
$("pRepeat").onclick=function(){ state.repeat=(state.repeat+1)%3; this.classList.toggle("off",state.repeat===0);
  this.textContent=state.repeat===1?"🔂":"🔁"; };

/* ---------- 标签切换 ---------- */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); state.tab=b.dataset.tab; render();
});
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); state.seg=b.dataset.seg; render();
});
$("navRight").onclick=()=>{ alert("（原型演示）正式版将打开“文件”选择器导入本地音频，支持 mp3 / m4a / flac / wav 等。"); };

render();
</script>
</body>
</html>
