name: LingYue
options:
  minimumXcodeGenVersion: "2.35.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit
    branch: main

targets:
  LingYue:
    type: application
    platform: iOS
    sources:
      - LingYue
    dependencies:
      # FFmpeg 核心解码库 + 其全部运行时附属库（Libavcodec 全功能版依赖这些，
      # 必须一次性全部嵌入，否则 dyld 逐个报缺导致启动闪退）
      - package: FFmpegKit
        product: Libavcodec
      - package: FFmpegKit
        product: Libavformat
      - package: FFmpegKit
        product: Libavutil
      - package: FFmpegKit
        product: Libswresample
      - package: FFmpegKit
        product: Libswscale
      - package: FFmpegKit
        product: Libavfilter
      - package: FFmpegKit
        product: Libavdevice
      - package: FFmpegKit
        product: libzvbi
      - package: FFmpegKit
        product: libsrt
      - package: FFmpegKit
        product: libssl
      - package: FFmpegKit
        product: libcrypto
      - package: FFmpegKit
        product: libopus
      - package: FFmpegKit
        product: libass
      - package: FFmpegKit
        product: libfreetype
      - package: FFmpegKit
        product: libfribidi
      - package: FFmpegKit
        product: libharfbuzz
      - package: FFmpegKit
        product: libfontconfig
      - package: FFmpegKit
        product: lcms2
      - package: FFmpegKit
        product: libdav1d
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingyue.app
        PRODUCT_NAME: LingYue
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LingYue/Info.plist
      properties:
        CFBundleDisplayName: 聆乐
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark

schemes:
  LingYue:
    build:
      targets:
        LingYue: all
    run:
      config: Debug
    archive:
      config: Release
