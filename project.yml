name: LingYue
options:
  minimumXcodeGenVersion: "2.35.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit
    branch: main

targets:
  LingYue:
    type: application
    platform: iOS
    sources:
      - LingYue
    dependencies:
      # 引用完整 FFmpegKit 产品：它声明并嵌入全部附属库
      # （Libavcodec 全功能版运行时依赖 libzvbi/libopus/libssl/libass 等，
      # 必须一次性全部嵌入，否则 dyld 逐个报缺导致启动闪退）
      - package: FFmpegKit
        product: FFmpegKit
      # 嵌入监控小组件扩展
      - target: LingYueWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingyue.app
        PRODUCT_NAME: LingYue
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: LingYue/Info.plist
      properties:
        CFBundleDisplayName: 聆乐
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lingyue.app
            CFBundleURLSchemes:
              - lingyue
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark

  LingYueWidget:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - LingYueWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingyue.app.LingYueWidget
        PRODUCT_NAME: LingYueWidget
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
    info:
      path: LingYueWidget/Info.plist
      properties:
        CFBundleDisplayName: 聆乐监控
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  LingYue:
    build:
      targets:
        LingYue: all
    run:
      config: Debug
    archive:
      config: Release
